name: Neon Migration Execute — STAGING (guarded, write)

# Manually triggered ONLY. This workflow applies the frozen Economy V2 migrations to an
# ISOLATED Neon STAGING branch (a branch created from the current production state) and
# records Prisma migration history there. It exists to validate the production migration
# sequence safely before any production execution.
#
# Hard isolation guarantees:
#   * connection comes ONLY from the STAGING_DIRECT secret — never DIRECT
#   * the connected branch id must equal the operator-supplied staging branch id
#   * the connected branch id must NOT equal the production branch id (fail-closed)
#   * production is never referenced by any connection string in this workflow
#
# Safety model (mirrors the hardened production workflow):
#   * required staging confirmation token + required staging branch input (fail-closed)
#   * least-privilege permissions (contents: read) and a non-cancelling concurrency group
#   * frozen SHA-256 checksum verification + transaction-safety scan before any write
#   * historical baselining via `prisma migrate resolve --applied` (metadata only)
#   * each economy migration applied in ONE transaction (psql --single-transaction)
#   * history recorded ONLY after the migration's effects are verified
#   * final history verification: names, per-row checksums, completion, no failed rows
#   * a staging verification report is written and uploaded as an artifact
#   * credentials/SQL output are never streamed; captured output is redacted before printing
#
# NOT guaranteed (same as production; see docs/PHASE_6B4C_STAGING_TEST.md):
#   * atomicity ACROSS a migration's SQL commit and its `_prisma_migrations` row
#   * exclusion of external writers to the staging branch
#   * no automatic retry/reapply: a re-dispatch after partial success is refused

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-ECONOMY-V2-STAGING to confirm a STAGING migration'
        required: true
        type: string
      staging_branch:
        description: 'Exact Neon STAGING branch id (e.g. br-xxxxxxxx), must differ from production'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-migration-staging
  cancel-in-progress: false

jobs:
  execute:
    name: Guarded STAGING migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Connection string comes exclusively from the repository secret STAGING_DIRECT.
      # It must point at the isolated staging branch (direct, non-pooled endpoint).
      DATABASE_URL: ${{ secrets.STAGING_DIRECT }}
      DIRECT_URL: ${{ secrets.STAGING_DIRECT }}
      STAGING_BRANCH: ${{ inputs.staging_branch }}
      PRODUCTION_BRANCH: br-delicate-butterfly-b4et73g9
      CONFIRM_TOKEN: APPLY-ECONOMY-V2-STAGING
      SCHEMA: server/prisma/schema.prisma
      MIG_6B1: server/prisma/migrations/20261017000000_phase6b1_economy_foundation/migration.sql
      MIG_6B2A: server/prisma/migrations/20261017010000_phase6b2a_username_case_insensitive/migration.sql
      MIG_HIST_USER: 20240101000000_add_user_model
      MIG_HIST_CEO: 20240102000000_create_ceo_model
      MIG_6B1_NAME: 20261017000000_phase6b1_economy_foundation
      MIG_6B2A_NAME: 20261017010000_phase6b2a_username_case_insensitive
      CHK_HIST_USER: 0cc0af4ab39b025d6953c196485bdfe76225c28729b529d9f3dbb46e6f7d7144
      CHK_HIST_CEO: 1a0fd8415489877c774f6e0a0c726734afbf773931e6d684be6cf7cfe2ab2107
      CHK_6B1: 1a04a9c5ba3bcc3fb66335c6ce79fbcea73915f106f7160f525da2ed559d7cb3
      CHK_6B2A: f44f174b372e040b694e0c30b2dd2c5d31a921f154cb4399753af992820cce82
    steps:
      - name: Confirm intent (token + staging branch)
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "$CONFIRM_TOKEN" ]; then
            echo "::error title=Confirmation failed::The confirmation input did not match the staging token. No action taken."
            exit 1
          fi
          if [ -z "${STAGING_BRANCH:-}" ]; then
            echo "::error title=Missing staging branch::Provide the exact Neon staging branch id."
            exit 1
          fi
          if [ "$STAGING_BRANCH" = "$PRODUCTION_BRANCH" ]; then
            echo "::error title=Refusing production::The staging branch input equals the production branch id. Use the production workflow instead."
            exit 1
          fi
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error title=Missing secret::Repository secret STAGING_DIRECT is not set."
            exit 1
          fi
          echo "STAGING migration confirmed for branch \`$STAGING_BRANCH\` (production \`$PRODUCTION_BRANCH\` is out of scope)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (workspaces + lockfile)
        run: npm ci --no-audit --no-fund

      - name: Verify frozen checksums and transaction safety
        run: |
          set -euo pipefail
          echo "### Frozen migration checksums" >> "$GITHUB_STEP_SUMMARY"
          declare -A EXPECTED=(
            ["server/prisma/migrations/20240101000000_add_user_model/migration.sql"]="$CHK_HIST_USER"
            ["server/prisma/migrations/20240102000000_create_ceo_model/migration.sql"]="$CHK_HIST_CEO"
            ["$MIG_6B1"]="$CHK_6B1"
            ["$MIG_6B2A"]="$CHK_6B2A"
            ["server/prisma/migrations/migration_lock.toml"]="d6bae7899f05da956e1070ba5703455503208ef79e161acb18c93bfe3c6cd236"
          )
          for f in "${!EXPECTED[@]}"; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$actual" != "${EXPECTED[$f]}" ]; then
              echo "::error title=Checksum mismatch::$f changed since the freeze"
              echo "- checksum FAIL: \`$f\`" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- checksum OK: \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done

          for f in "$MIG_6B1" "$MIG_6B2A"; do
            if grep -Eiq '(^|[^A-Za-z])(BEGIN|COMMIT|ROLLBACK)([^A-Za-z]|$)|CREATE[[:space:]]+INDEX[[:space:]]+CONCURRENTLY|CREATE[[:space:]]+DATABASE|DROP[[:space:]]+DATABASE|VACUUM|REINDEX[[:space:]]+.*CONCURRENTLY' "$f"; then
              echo "::error title=Transaction-unsafe SQL::$f contains statements incompatible with psql --single-transaction"
              exit 1
            fi
          done
          echo "- both economy migrations are transaction-safe" >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-migration read-only checks (staging isolation)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          echo "### Pre-migration state (staging)" >> "$GITHUB_STEP_SUMMARY"

          BRANCH="$(q "SELECT current_setting('neon.branch_id', true)")"
          if [ -z "$BRANCH" ]; then
            echo "::error title=Branch unverified::Neon branch identity is not exposed by this connection"
            exit 1
          fi
          if [ "$BRANCH" = "$PRODUCTION_BRANCH" ]; then
            echo "::error title=PRODUCTION REACHED::STAGING_DIRECT resolves to the production branch. Aborting; no writes."
            exit 1
          fi
          if [ "$BRANCH" != "$STAGING_BRANCH" ]; then
            echo "::error title=Branch mismatch::connected branch is not the supplied staging branch"
            exit 1
          fi
          echo "- branch OK: \`${BRANCH}\` (staging; production \`$PRODUCTION_BRANCH\` not connected)" >> "$GITHUB_STEP_SUMMARY"

          USERS="$(q "SELECT count(*) FROM \"User\"")"
          USER_IDS="$(q "SELECT string_agg(id::text, ',' ORDER BY id) FROM \"User\"")"
          CEOS="$(q "SELECT count(*) FROM \"CEO\"")"
          CEO_IDS="$(q "SELECT string_agg(id::text, ',' ORDER BY id) FROM \"CEO\"")"
          UCOLL="$(q "SELECT count(*) FROM (SELECT lower(username) FROM \"User\" GROUP BY lower(username) HAVING count(*)>1) x")"
          MIG_TABLE="$(q "SELECT to_regclass('public._prisma_migrations') IS NOT NULL")"
          APP_META="$(q "SELECT to_regclass('public.AppMeta') IS NOT NULL")"
          OWNED="$(q "SELECT to_regclass('public.OwnedCeo') IS NOT NULL")"
          ECON_COLS="$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('baseSpPerCycle','maxOwned','isStarter')")"
          LOWER_IDX="$(q "SELECT to_regclass('public.\"User_username_lower_key\"') IS NOT NULL")"

          HIST_ROLE="$(q "SELECT count(*) FROM pg_type WHERE typtype='e' AND typnamespace='public'::regnamespace AND typname='Role'")"
          HIST_IDX="$(q "SELECT string_agg(indexname, ',' ORDER BY indexname) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('User_email_key','User_username_key','CEO_slug_key')")"
          USER_COLS="$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='User' AND column_name IN ('id','email','username','passwordHash','role','createdAt','updatedAt')")"
          CEO_COLS="$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('id','name','slug','rarity','priceUsd','dailyRatePercent','cycleHours','energyCost','isActive','createdAt','updatedAt')")"

          fail=0
          [ "$USERS" = "2" ] || { echo "::error title=Unexpected User count::expected 2"; fail=1; }
          [ "$USER_IDS" = "2,4" ] || { echo "::error title=Unexpected User ids::expected 2,4"; fail=1; }
          [ "$CEOS" = "8" ] || { echo "::error title=Unexpected CEO count::expected 8"; fail=1; }
          [ "$CEO_IDS" = "2,3,4,5,6,7,8,10" ] || { echo "::error title=Unexpected CEO ids::expected 2,3,4,5,6,7,8,10"; fail=1; }
          [ "$UCOLL" = "0" ] || { echo "::error title=Case-insensitive username collisions::none expected"; fail=1; }
          [ "$MIG_TABLE" = "f" ] || { echo "::error title=Unexpected _prisma_migrations::staging branch is not at pre-migration state"; fail=1; }
          [ "$APP_META" = "f" ] || { echo "::error title=Unexpected AppMeta::economy objects already present"; fail=1; }
          [ "$OWNED" = "f" ] || { echo "::error title=Unexpected OwnedCeo::economy objects already present"; fail=1; }
          [ "$ECON_COLS" = "0" ] || { echo "::error title=Unexpected economy columns::already present"; fail=1; }
          [ "$LOWER_IDX" = "f" ] || { echo "::error title=Unexpected User_username_lower_key::already present"; fail=1; }
          [ "$HIST_ROLE" = "1" ] || { echo "::error title=Historical schema::Role enum missing; historical baseline is not justified"; fail=1; }
          [ "$HIST_IDX" = "CEO_slug_key,User_email_key,User_username_key" ] || { echo "::error title=Historical schema::historical unique indexes missing: $HIST_IDX"; fail=1; }
          [ "$USER_COLS" = "7" ] || { echo "::error title=Historical schema::User columns do not match the historical migration"; fail=1; }
          [ "$CEO_COLS" = "11" ] || { echo "::error title=Historical schema::CEO columns do not match the historical migration"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "- ❌ staging pre-migration state failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- User=2 (ids 2,4); CEO=8 (ids 2,3,4,5,6,7,8,10); 0 collisions; staging pre-migration state OK" >> "$GITHUB_STEP_SUMMARY"
          echo "- historical schema matches -> safe to baseline" >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline historical migrations (metadata only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          redact() {
            sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g'
          }
          resolve() {
            local name="$1"
            if ! npx prisma migrate resolve --schema "$SCHEMA" --applied "$name" >"$OUTDIR/resolve.out" 2>"$OUTDIR/resolve.err"; then
              { cat "$OUTDIR/resolve.err"; cat "$OUTDIR/resolve.out"; } | redact >&2
              echo "::error title=Baseline failed::prisma migrate resolve failed for $name"
              exit 1
            fi
            echo "- baselined (metadata only): \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          }
          echo "### Historical baseline (staging)" >> "$GITHUB_STEP_SUMMARY"

          resolve "$MIG_HIST_USER"
          resolve "$MIG_HIST_CEO"

          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              redact < "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          ROWS="$(q "SELECT string_agg(migration_name, ',' ORDER BY migration_name) FROM _prisma_migrations")"
          CHK_USER_ROW="$(q "SELECT checksum FROM _prisma_migrations WHERE migration_name='$MIG_HIST_USER'")"
          CHK_CEO_ROW="$(q "SELECT checksum FROM _prisma_migrations WHERE migration_name='$MIG_HIST_CEO'")"

          if [ "$ROWS" != "$MIG_HIST_USER,$MIG_HIST_CEO" ]; then
            echo "::error title=Baseline verification failed::_prisma_migrations does not contain exactly the two historical rows"
            echo "- ❌ baseline rows: ${ROWS}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$CHK_USER_ROW" != "$CHK_HIST_USER" ] || [ "$CHK_CEO_ROW" != "$CHK_HIST_CEO" ]; then
            echo "::error title=Baseline checksum mismatch::recorded checksum does not match the frozen SHA-256"
            echo "- ❌ baseline checksum mismatch" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- baseline OK: \`$ROWS\` (checksums match frozen SHA-256)" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply 6B1 economy foundation (single transaction)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$MIG_6B1" >"$OUTDIR/6b1.out" 2>"$OUTDIR/6b1.err"; then
            echo "- 6B1 applied inside a single transaction (psql output suppressed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=6B1 apply failed::transaction rolled back; no schema changes were committed"
            { cat "$OUTDIR/6b1.err"; cat "$OUTDIR/6b1.out"; } | tail -n 40 | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            exit 1
          fi

      - name: Verify 6B1 effects (read-only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          TABLES="$(q "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('AppMeta','OwnedCeo','ReferralAttribution','IdempotencyKey')")"
          ENUMS="$(q "SELECT string_agg(typname, ',' ORDER BY typname) FROM pg_type WHERE typtype='e' AND typnamespace='public'::regnamespace AND typname IN ('AcquisitionType','OwnedCeoStatus')")"
          COLS="$(q "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('baseSpPerCycle','category','displayOrder','isStarter','maxOwned','rewardEligible')")"
          IDX="$(q "SELECT string_agg(indexname, ',' ORDER BY indexname) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('AppMeta_key_key','IdempotencyKey_userId_scope_key_key','OwnedCeo_starter_user_key','OwnedCeo_templateId_idx','OwnedCeo_userId_idx','OwnedCeo_userId_status_idx','ReferralAttribution_referredUserId_key','ReferralAttribution_referrerId_idx')")"
          NOSELF="$(q "SELECT count(*) FROM pg_constraint WHERE conname='ReferralAttribution_no_self'")"
          FKS="$(q "SELECT count(*) FROM pg_constraint WHERE contype='f' AND conrelid IN ('\"OwnedCeo\"'::regclass,'\"ReferralAttribution\"'::regclass,'\"IdempotencyKey\"'::regclass)")"
          CEOS="$(q "SELECT count(*) FROM \"CEO\"")"
          USERS="$(q "SELECT count(*) FROM \"User\"")"
          PRESERVED="$(q "SELECT string_agg(id::text, ',' ORDER BY id) FROM \"CEO\" WHERE id IN (2,3,4,5,6,7,8,10)")"
          NEWROWS="$(q "SELECT count(*) FROM \"CEO\" WHERE slug IN ('intern-ceo','crypto-whale')")"
          INTERN="$(q "SELECT \"isStarter\"::text || ':' || \"baseSpPerCycle\"::text || ':' || \"maxOwned\"::text FROM \"CEO\" WHERE slug='intern-ceo'")"
          WHALE="$(q "SELECT \"baseSpPerCycle\"::text || ':' || \"maxOwned\"::text FROM \"CEO\" WHERE slug='crypto-whale'")"

          fail=0
          [ "$TABLES" = "AppMeta,IdempotencyKey,OwnedCeo,ReferralAttribution" ] || { echo "::error title=6B1 tables::unexpected tables: $TABLES"; fail=1; }
          [ "$ENUMS" = "AcquisitionType,OwnedCeoStatus" ] || { echo "::error title=6B1 enums::unexpected enums: $ENUMS"; fail=1; }
          [ "$COLS" = "baseSpPerCycle,category,displayOrder,isStarter,maxOwned,rewardEligible" ] || { echo "::error title=6B1 columns::unexpected columns: $COLS"; fail=1; }
          [ "$IDX" = "AppMeta_key_key,IdempotencyKey_userId_scope_key_key,OwnedCeo_starter_user_key,OwnedCeo_templateId_idx,OwnedCeo_userId_idx,OwnedCeo_userId_status_idx,ReferralAttribution_referredUserId_key,ReferralAttribution_referrerId_idx" ] || { echo "::error title=6B1 indexes::unexpected indexes: $IDX"; fail=1; }
          [ "$NOSELF" = "1" ] || { echo "::error title=6B1 check constraint::ReferralAttribution_no_self missing"; fail=1; }
          [ "$FKS" = "5" ] || { echo "::error title=6B1 foreign keys::expected 5, got $FKS"; fail=1; }
          [ "$CEOS" = "10" ] || { echo "::error title=CEO count::expected 10, got $CEOS"; fail=1; }
          [ "$USERS" = "2" ] || { echo "::error title=User count::expected 2, got $USERS"; fail=1; }
          [ "$PRESERVED" = "2,3,4,5,6,7,8,10" ] || { echo "::error title=CEO ids::existing ids not preserved: $PRESERVED"; fail=1; }
          [ "$NEWROWS" = "2" ] || { echo "::error title=New CEO rows::intern-ceo/crypto-whale missing"; fail=1; }
          [ "$INTERN" = "true:10:1" ] || { echo "::error title=intern-ceo values::expected true:10:1, got $INTERN"; fail=1; }
          [ "$WHALE" = "600:2" ] || { echo "::error title=crypto-whale values::expected 600:2, got $WHALE"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "::error title=6B1 verification failed::DDL is committed but history is NOT recorded. See recovery in docs/PHASE_6B4C_STAGING_TEST.md"
            echo "- ❌ 6B1 verification failed (history not recorded)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ 6B1 effects verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Record 6B1 applied (metadata only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! npx prisma migrate resolve --schema "$SCHEMA" --applied "$MIG_6B1_NAME" >"$OUTDIR/resolve.out" 2>"$OUTDIR/resolve.err"; then
            { cat "$OUTDIR/resolve.err"; cat "$OUTDIR/resolve.out"; } | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            echo "::error title=Record 6B1 failed::SQL is committed but history was NOT recorded. See recovery in docs/PHASE_6B4C_STAGING_TEST.md"
            exit 1
          fi
          echo "- 6B1 recorded in _prisma_migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply 6B2A username case-insensitive index (single transaction)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$MIG_6B2A" >"$OUTDIR/6b2a.out" 2>"$OUTDIR/6b2a.err"; then
            echo "- 6B2A applied inside a single transaction (psql output suppressed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=6B2A apply failed::transaction rolled back; no schema changes were committed"
            { cat "$OUTDIR/6b2a.err"; cat "$OUTDIR/6b2a.out"; } | tail -n 40 | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            exit 1
          fi

      - name: Verify 6B2A effects (read-only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          IDX="$(q "SELECT to_regclass('public.\"User_username_lower_key\"') IS NOT NULL")"
          UCOLL="$(q "SELECT count(*) FROM (SELECT lower(username) FROM \"User\" GROUP BY lower(username) HAVING count(*)>1) x")"
          fail=0
          [ "$IDX" = "t" ] || { echo "::error title=6B2A index::User_username_lower_key missing"; fail=1; }
          [ "$UCOLL" = "0" ] || { echo "::error title=6B2A collisions::case-insensitive username collisions appeared"; fail=1; }
          if [ "$fail" -ne 0 ]; then
            echo "::error title=6B2A verification failed::index is committed but history is NOT recorded. See recovery in docs/PHASE_6B4C_STAGING_TEST.md"
            echo "- ❌ 6B2A verification failed (history not recorded)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ 6B2A effects verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Record 6B2A applied (metadata only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! npx prisma migrate resolve --schema "$SCHEMA" --applied "$MIG_6B2A_NAME" >"$OUTDIR/resolve.out" 2>"$OUTDIR/resolve.err"; then
            { cat "$OUTDIR/resolve.err"; cat "$OUTDIR/resolve.out"; } | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            echo "::error title=Record 6B2A failed::SQL is committed but history was NOT recorded. See recovery in docs/PHASE_6B4C_STAGING_TEST.md"
            exit 1
          fi
          echo "- 6B2A recorded in _prisma_migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Final verification (history names, checksums, completion)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          redact() {
            sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g'
          }
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              redact < "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          echo "### Final verification (staging)" >> "$GITHUB_STEP_SUMMARY"

          HIST="$(q "SELECT string_agg(migration_name, ',' ORDER BY migration_name) FROM _prisma_migrations")"
          EXPECTED_HIST="$MIG_HIST_USER,$MIG_HIST_CEO,$MIG_6B1_NAME,$MIG_6B2A_NAME"
          if [ "$HIST" != "$EXPECTED_HIST" ]; then
            echo "::error title=Migration history::unexpected applied set: $HIST"
            exit 1
          fi

          INCOMPLETE="$(q "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL")"
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error title=Migration history::failed/incomplete migration rows present"
            echo "- ❌ history contains incomplete/rolled-back rows" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          verify_checksum() {
            local name="$1" expected="$2" actual
            actual="$(q "SELECT checksum FROM _prisma_migrations WHERE migration_name='$name'")"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=History checksum mismatch::$name recorded checksum does not match the frozen SHA-256"
              return 1
            fi
            echo "- checksum OK: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          }
          verify_checksum "$MIG_HIST_USER" "$CHK_HIST_USER"
          verify_checksum "$MIG_HIST_CEO" "$CHK_HIST_CEO"
          verify_checksum "$MIG_6B1_NAME" "$CHK_6B1"
          verify_checksum "$MIG_6B2A_NAME" "$CHK_6B2A"

          echo "- history OK: \`$HIST\` (all finished, no failed rows, checksums match)" >> "$GITHUB_STEP_SUMMARY"

          npx prisma migrate status --schema "$SCHEMA" 2>&1 | redact
          echo "- ✅ prisma migrate status: no pending migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate Prisma client (codegen only)
        run: npx prisma generate --schema "$SCHEMA"

      - name: Build staging verification report (artifact)
        if: always()
        run: |
          set -euo pipefail
          REPORT="${RUNNER_TEMP:-/tmp}/staging-migration-report.md"
          {
            echo "# TycoonX — Neon STAGING migration verification report"
            echo ""
            echo "- Workflow: Neon Migration Execute — STAGING (guarded, write)"
            echo "- Staging branch: \`$STAGING_BRANCH\`"
            echo "- Production branch (not connected): \`$PRODUCTION_BRANCH\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Run: \`${{ github.run_id }}\`"
            echo "- Result: **${{ job.status }}**"
            echo ""
            echo "## Captured job summary"
            echo ""
            cat "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          } > "$REPORT"
          echo "Staging report written to $REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload staging verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-migration-report
          path: ${{ runner.temp }}/staging-migration-report.md
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "Guarded STAGING write workflow. Baseline (metadata) + two transactional applies + history recording."
            echo "Connection used: STAGING_DIRECT only; production is never connected."
            echo "Credentials/SQL output are never streamed; captured output is redacted."
            echo "No automatic retry/reapply: re-dispatch is refused by the pre-migration check."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ job.status }}" = "success" ]; then
            echo "**Result: ✅ PASS**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Result: ❌ FAIL — inspect steps; recovery in docs/PHASE_6B4C_STAGING_TEST.md**" >> "$GITHUB_STEP_SUMMARY"
          fi
