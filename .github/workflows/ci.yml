name: CI

# Verification only: unit tests, both builds, and Prisma schema validation.
# No deploy, no financial flags, no database migrations, no secrets.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholders only — these commands never connect to a database.
      DATABASE_URL: 'postgresql://user:pass@localhost:5432/ci?sslmode=disable'
      DIRECT_URL: 'postgresql://user:pass@localhost:5432/ci?sslmode=disable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=server
      - name: Server unit tests
        run: npm test --workspace=server
      - name: Server build (tsc)
        run: npm run build --workspace=server
      - name: Client build (tsc + vite + PWA)
        run: npm run build --prefix client
      - name: Prisma schema validation
        run: npx prisma validate
        working-directory: server
