name: Neon Migration Execute (guarded, write)

# Manually triggered ONLY. Applies the two frozen V2.5 migrations to the production
# Neon branch and records Prisma migration history. It is write-capable and must be
# dispatched only after the read-only preflight has passed and execution has been
# explicitly approved. Never triggered by push, pull_request, or schedule.
#
# Production is already baselined through Phase 6B.2A (_prisma_migrations = 4 rows),
# so this workflow does NOT re-baseline history and does NOT touch 6B.1/6B.2A. It
# applies only:
#   20261018000000_v25_economy_sp_production
#   20261018010000_v25_progression
#
# Safety model:
#   * required confirmation token input (fail-closed if absent/incorrect)
#   * least-privilege permissions (contents: read) + non-cancelling concurrency group
#   * frozen SHA-256 verification + transaction-safety scan before any write
#   * exact production branch AND project identity verification before any write
#   * pre-migration state verification (baseline = 4 rows; V2.5 objects absent)
#   * each migration applied in ONE transaction (psql --single-transaction)
#   * history recorded ONLY after the migration's effects are verified
#   * final verification: 6 rows, per-row checksums, completion, no failed rows
#   * credentials/SQL output are never streamed; captured output is redacted
#
# NOT guaranteed (documented): atomicity across a migration's SQL commit and its
# _prisma_migrations row (small commit->resolve window; job fails closed and requires
# manual recovery), and exclusion of external database writers during the run.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type APPLY-V25-br-delicate-butterfly-b4et73g9 to confirm a production migration'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-migration-execute
  cancel-in-progress: false

jobs:
  execute:
    name: Guarded production migration (V2.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Connection string comes exclusively from the repository secret DIRECT.
      # DIRECT must be the direct (non-pooled) Neon endpoint (TCP reachable from the runner).
      DATABASE_URL: ${{ secrets.DIRECT }}
      DIRECT_URL: ${{ secrets.DIRECT }}
      EXPECTED_BRANCH: br-delicate-butterfly-b4et73g9
      EXPECTED_PROJECT_ID: wandering-king-57462138
      CONFIRM_TOKEN: APPLY-V25-br-delicate-butterfly-b4et73g9
      SCHEMA: server/prisma/schema.prisma
      MIG_V25_ECON: server/prisma/migrations/20261018000000_v25_economy_sp_production/migration.sql
      MIG_V25_PROG: server/prisma/migrations/20261018010000_v25_progression/migration.sql
      MIG_V25_ECON_NAME: 20261018000000_v25_economy_sp_production
      MIG_V25_PROG_NAME: 20261018010000_v25_progression
      BASELINE_HIST: "20240101000000_add_user_model,20240102000000_create_ceo_model,20261017000000_phase6b1_economy_foundation,20261017010000_phase6b2a_username_case_insensitive"
      FINAL_HIST: "20240101000000_add_user_model,20240102000000_create_ceo_model,20261017000000_phase6b1_economy_foundation,20261017010000_phase6b2a_username_case_insensitive,20261018000000_v25_economy_sp_production,20261018010000_v25_progression"
      CHK_HIST_USER: 0cc0af4ab39b025d6953c196485bdfe76225c28729b529d9f3dbb46e6f7d7144
      CHK_HIST_CEO: 1a0fd8415489877c774f6e0a0c726734afbf773931e6d684be6cf7cfe2ab2107
      CHK_6B1: 1a04a9c5ba3bcc3fb66335c6ce79fbcea73915f106f7160f525da2ed559d7cb3
      CHK_6B2A: f44f174b372e040b694e0c30b2dd2c5d31a921f154cb4399753af992820cce82
      CHK_V25_ECON: 7700cb1f5b1514ba982b6349af7dae2085b6a8a83fee4511f6da82e122a03209
      CHK_V25_PROG: 36e26e87469b671a8b4093e8f007a4fa46413c63d1af5f3042a2f271367cad9a
      CHK_LOCK: d6bae7899f05da956e1070ba5703455503208ef79e161acb18c93bfe3c6cd236
    steps:
      - name: Confirm intent (required token)
        env:
          CONFIRM_INPUT: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_INPUT" != "$CONFIRM_TOKEN" ]; then
            echo "::error title=Confirmation failed::The confirmation input did not match the required token. No action taken."
            exit 1
          fi
          echo "Confirmation accepted for branch \`$EXPECTED_BRANCH\` (V2.5 migration set)." >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies (workspaces + lockfile)
        run: npm ci --no-audit --no-fund

      - name: Verify frozen checksums and transaction safety
        run: |
          set -euo pipefail
          echo "### Frozen migration checksums" >> "$GITHUB_STEP_SUMMARY"
          declare -A EXPECTED=(
            ["server/prisma/migrations/20240101000000_add_user_model/migration.sql"]="$CHK_HIST_USER"
            ["server/prisma/migrations/20240102000000_create_ceo_model/migration.sql"]="$CHK_HIST_CEO"
            ["server/prisma/migrations/20261017000000_phase6b1_economy_foundation/migration.sql"]="$CHK_6B1"
            ["server/prisma/migrations/20261017010000_phase6b2a_username_case_insensitive/migration.sql"]="$CHK_6B2A"
            ["$MIG_V25_ECON"]="$CHK_V25_ECON"
            ["$MIG_V25_PROG"]="$CHK_V25_PROG"
            ["server/prisma/migrations/migration_lock.toml"]="$CHK_LOCK"
          )
          for f in "${!EXPECTED[@]}"; do
            actual="$(sha256sum "$f" | awk '{print $1}')"
            if [ "$actual" != "${EXPECTED[$f]}" ]; then
              echo "::error title=Checksum mismatch::$f changed since the freeze"
              echo "- checksum FAIL: \`$f\`" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- checksum OK: \`$f\`" >> "$GITHUB_STEP_SUMMARY"
          done

          # Each apply step wraps its file in a single transaction. Refuse any statement
          # that cannot run inside one, or an embedded BEGIN/COMMIT.
          for f in "$MIG_V25_ECON" "$MIG_V25_PROG"; do
            if grep -Eiq '(^|[^A-Za-z])(BEGIN|COMMIT|ROLLBACK)([^A-Za-z]|$)|CREATE[[:space:]]+INDEX[[:space:]]+CONCURRENTLY|CREATE[[:space:]]+DATABASE|DROP[[:space:]]+DATABASE|VACUUM|REINDEX[[:space:]]+.*CONCURRENTLY' "$f"; then
              echo "::error title=Transaction-unsafe SQL::$f contains statements incompatible with psql --single-transaction"
              exit 1
            fi
          done
          echo "- both V2.5 migrations are transaction-safe (no BEGIN/COMMIT/CONCURRENTLY)" >> "$GITHUB_STEP_SUMMARY"

      - name: Pre-migration read-only checks
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi

          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }

          echo "### Pre-migration state" >> "$GITHUB_STEP_SUMMARY"

          BRANCH="$(q "SELECT current_setting('neon.branch_id', true)")"
          PROJECT="$(q "SELECT current_setting('neon.project_id', true)")"
          if [ -z "$BRANCH" ]; then
            echo "::error title=Branch unverified::Neon branch identity is not exposed by this connection"
            exit 1
          fi
          if [ "$BRANCH" != "$EXPECTED_BRANCH" ]; then
            echo "::error title=Branch mismatch::connected branch is not the expected production branch"
            exit 1
          fi
          if [ -z "$PROJECT" ] || [ "$PROJECT" != "$EXPECTED_PROJECT_ID" ]; then
            echo "::error title=Project mismatch::connected project is not $EXPECTED_PROJECT_ID"
            exit 1
          fi
          echo "- branch OK: \`${BRANCH}\` (project \`${PROJECT}\`)" >> "$GITHUB_STEP_SUMMARY"

          HIST="$(q "SELECT string_agg(migration_name, ',' ORDER BY started_at) FROM _prisma_migrations")"
          INCOMPLETE="$(q "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL")"
          USERS="$(q "SELECT count(*) FROM \"User\"")"
          CEOS="$(q "SELECT count(*) FROM \"CEO\"")"
          OWNED="$(q "SELECT count(*) FROM \"OwnedCeo\"")"
          UCOLL="$(q "SELECT count(*) FROM (SELECT lower(username) FROM \"User\" GROUP BY lower(username) HAVING count(*)>1) x")"
          BASE_TABLES="$(q "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('AppMeta','IdempotencyKey','OwnedCeo','ReferralAttribution')")"
          LOWER_IDX="$(q "SELECT to_regclass('public.\"User_username_lower_key\"') IS NOT NULL")"
          ECON_COLS="$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('baseSpPerCycle','maxOwned','isStarter')")"
          NEW_TABLES="$(q "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('ProductionCycle','SpAccount','SpLedgerEntry','ProgressAccount','TaskEvent','TaskClaim','AchievementClaim','UserProfile','WithdrawalRequest')")"
          NEW_CEO_COLS="$(q "SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('nominalSpPer24h','lifetimeCapSp')")"

          fail=0
          [ "$HIST" = "$BASELINE_HIST" ] || { echo "::error title=Baseline history::expected exactly the 4 baseline rows; refusing to reapply"; fail=1; }
          [ "$INCOMPLETE" = "0" ] || { echo "::error title=History::failed/incomplete rows present"; fail=1; }
          [ "$USERS" -ge 3 ] || { echo "::error title=User count::expected >= 3"; fail=1; }
          [ "$CEOS" = "10" ] || { echo "::error title=CEO count::expected 10"; fail=1; }
          [ "$UCOLL" = "0" ] || { echo "::error title=Username collisions::none expected"; fail=1; }
          [ "$BASE_TABLES" = "AppMeta,IdempotencyKey,OwnedCeo,ReferralAttribution" ] || { echo "::error title=Baseline tables::unexpected: $BASE_TABLES"; fail=1; }
          [ "$LOWER_IDX" = "t" ] || { echo "::error title=Baseline index::User_username_lower_key missing"; fail=1; }
          [ "$ECON_COLS" = "3" ] || { echo "::error title=Economy columns::6B.1 columns missing"; fail=1; }
          [ "$NEW_TABLES" = "0" ] || { echo "::error title=V2.5 tables::already present; refusing to reapply"; fail=1; }
          [ "$NEW_CEO_COLS" = "0" ] || { echo "::error title=V2.5 CEO columns::already present; refusing to reapply"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "- ❌ pre-migration state failed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- baseline OK: 4 migration rows; 6B.1 objects present; V2.5 objects absent; User=${USERS} CEO=${CEOS} OwnedCeo=${OWNED}" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply V2.5 economy (single transaction)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$MIG_V25_ECON" >"$OUTDIR/econ.out" 2>"$OUTDIR/econ.err"; then
            echo "- V2.5 economy applied inside a single transaction (psql output suppressed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=V2.5 economy apply failed::transaction rolled back; no schema changes were committed"
            { cat "$OUTDIR/econ.err"; cat "$OUTDIR/econ.out"; } | tail -n 40 | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            exit 1
          fi

      - name: Verify V2.5 economy effects (read-only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          TABLES="$(q "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('ProductionCycle','SpAccount','SpLedgerEntry','ProgressAccount')")"
          CEO_COLS="$(q "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='public' AND table_name='CEO' AND column_name IN ('nominalSpPer24h','lifetimeCapSp')")"
          OWNED_COLS="$(q "SELECT string_agg(column_name, ',' ORDER BY column_name) FROM information_schema.columns WHERE table_schema='public' AND table_name='OwnedCeo' AND column_name IN ('equipment','lifetimeEarnedSp','archivedAt')")"
          IDX="$(q "SELECT string_agg(indexname, ',' ORDER BY indexname) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('ProductionCycle_open_owned_key','SpLedgerEntry_userId_sourceType_sourceId_bucket_key')")"
          ACTIVE="$(q "SELECT count(*) FROM \"CEO\" WHERE \"isActive\"")"
          ACTIVE_SLUGS="$(q "SELECT string_agg(slug, ',' ORDER BY id) FROM \"CEO\" WHERE \"isActive\"")"
          WHALE_ACTIVE="$(q "SELECT \"isActive\" FROM \"CEO\" WHERE slug='crypto-whale'")"
          TESTCEO_ACTIVE="$(q "SELECT \"isActive\" FROM \"CEO\" WHERE slug='test-ceo'")"
          INTERN="$(q "SELECT \"nominalSpPer24h\"::text || ':' || \"lifetimeCapSp\"::text FROM \"CEO\" WHERE slug='intern-ceo'")"
          JUNIOR="$(q "SELECT \"priceUsd\"::text || ':' || \"nominalSpPer24h\"::text || ':' || \"lifetimeCapSp\"::text FROM \"CEO\" WHERE slug='junior-developer'")"
          TOP="$(q "SELECT \"priceUsd\"::text || ':' || \"nominalSpPer24h\"::text || ':' || \"lifetimeCapSp\"::text FROM \"CEO\" WHERE slug='tech-billionaire'")"
          CEOS="$(q "SELECT count(*) FROM \"CEO\"")"
          USERS="$(q "SELECT count(*) FROM \"User\"")"
          OWNED="$(q "SELECT count(*) FROM \"OwnedCeo\"")"

          fail=0
          [ "$TABLES" = "ProductionCycle,ProgressAccount,SpAccount,SpLedgerEntry" ] || { echo "::error title=V2.5 economy tables::unexpected: $TABLES"; fail=1; }
          [ "$CEO_COLS" = "lifetimeCapSp,nominalSpPer24h" ] || { echo "::error title=V2.5 CEO columns::unexpected: $CEO_COLS"; fail=1; }
          [ "$OWNED_COLS" = "archivedAt,equipment,lifetimeEarnedSp" ] || { echo "::error title=V2.5 OwnedCeo columns::unexpected: $OWNED_COLS"; fail=1; }
          [ "$IDX" = "ProductionCycle_open_owned_key,SpLedgerEntry_userId_sourceType_sourceId_bucket_key" ] || { echo "::error title=V2.5 indexes::unexpected: $IDX"; fail=1; }
          [ "$ACTIVE" = "8" ] || { echo "::error title=Catalog active tiers::expected 8, got $ACTIVE"; fail=1; }
          [ "$ACTIVE_SLUGS" = "junior-developer,product-manager,marketing-director,startup-founder,ai-architect,cloud-executive,tech-billionaire,intern-ceo" ] || { echo "::error title=Catalog active slugs::unexpected: $ACTIVE_SLUGS"; fail=1; }
          [ "$WHALE_ACTIVE" = "f" ] || { echo "::error title=crypto-whale::must be inactive"; fail=1; }
          [ "$TESTCEO_ACTIVE" = "f" ] || { echo "::error title=test-ceo::must be inactive"; fail=1; }
          [ "$INTERN" = "10:40" ] || { echo "::error title=intern-ceo::expected 10:40, got $INTERN"; fail=1; }
          [ "$JUNIOR" = "0.99:100:1200" ] || { echo "::error title=junior-developer::expected 0.99:100:1200, got $JUNIOR"; fail=1; }
          [ "$TOP" = "999.99:100000:2000000" ] || { echo "::error title=tech-billionaire::expected 999.99:100000:2000000, got $TOP"; fail=1; }
          [ "$CEOS" = "10" ] || { echo "::error title=CEO count::expected 10, got $CEOS"; fail=1; }
          [ "$USERS" -ge 3 ] || { echo "::error title=User count::expected >= 3, got $USERS"; fail=1; }
          [ "$OWNED" -ge 2 ] || { echo "::error title=OwnedCeo count::expected >= 2, got $OWNED"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "::error title=V2.5 economy verification failed::DDL is committed but history is NOT recorded."
            echo "- ❌ V2.5 economy verification failed (history not recorded)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ V2.5 economy effects verified (8 active tiers; caps/rates correct; history preserved)" >> "$GITHUB_STEP_SUMMARY"

      - name: Record V2.5 economy applied (metadata only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! npx prisma migrate resolve --schema "$SCHEMA" --applied "$MIG_V25_ECON_NAME" >"$OUTDIR/resolve.out" 2>"$OUTDIR/resolve.err"; then
            { cat "$OUTDIR/resolve.err"; cat "$OUTDIR/resolve.out"; } | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            echo "::error title=Record V2.5 economy failed::SQL is committed but history was NOT recorded."
            exit 1
          fi
          echo "- V2.5 economy recorded in _prisma_migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply V2.5 progression (single transaction)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if psql "$DIRECT_URL" -v ON_ERROR_STOP=1 --single-transaction -f "$MIG_V25_PROG" >"$OUTDIR/prog.out" 2>"$OUTDIR/prog.err"; then
            echo "- V2.5 progression applied inside a single transaction (psql output suppressed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=V2.5 progression apply failed::transaction rolled back; no schema changes were committed"
            { cat "$OUTDIR/prog.err"; cat "$OUTDIR/prog.out"; } | tail -n 40 | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            exit 1
          fi

      - name: Verify V2.5 progression effects (read-only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          TABLES="$(q "SELECT string_agg(table_name, ',' ORDER BY table_name) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('AchievementClaim','TaskClaim','TaskEvent','UserProfile','WithdrawalRequest')")"
          ENUMS="$(q "SELECT string_agg(typname, ',' ORDER BY typname) FROM pg_type WHERE typtype='e' AND typnamespace='public'::regnamespace AND typname IN ('TaskEventType','WithdrawalStatus')")"
          IDX="$(q "SELECT string_agg(indexname, ',' ORDER BY indexname) FROM pg_indexes WHERE schemaname='public' AND indexname IN ('AchievementClaim_userId_trackKey_stage_key','TaskClaim_userId_taskKey_periodKey_key')")"

          fail=0
          [ "$TABLES" = "AchievementClaim,TaskClaim,TaskEvent,UserProfile,WithdrawalRequest" ] || { echo "::error title=V2.5 progression tables::unexpected: $TABLES"; fail=1; }
          [ "$ENUMS" = "TaskEventType,WithdrawalStatus" ] || { echo "::error title=V2.5 progression enums::unexpected: $ENUMS"; fail=1; }
          [ "$IDX" = "AchievementClaim_userId_trackKey_stage_key,TaskClaim_userId_taskKey_periodKey_key" ] || { echo "::error title=V2.5 progression indexes::unexpected: $IDX"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "::error title=V2.5 progression verification failed::DDL is committed but history is NOT recorded."
            echo "- ❌ V2.5 progression verification failed (history not recorded)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- ✅ V2.5 progression effects verified" >> "$GITHUB_STEP_SUMMARY"

      - name: Record V2.5 progression applied (metadata only)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          if ! npx prisma migrate resolve --schema "$SCHEMA" --applied "$MIG_V25_PROG_NAME" >"$OUTDIR/resolve.out" 2>"$OUTDIR/resolve.err"; then
            { cat "$OUTDIR/resolve.err"; cat "$OUTDIR/resolve.out"; } | sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g' >&2
            echo "::error title=Record V2.5 progression failed::SQL is committed but history was NOT recorded."
            exit 1
          fi
          echo "- V2.5 progression recorded in _prisma_migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Final verification (history names, checksums, completion)
        run: |
          set -euo pipefail
          OUTDIR="${RUNNER_TEMP:-/tmp}"
          redact() {
            sed -E 's#postgres(ql)?://[^ ]+#[REDACTED_DSN]#g; s#[A-Za-z0-9.-]+\.neon\.tech#[REDACTED_HOST]#g'
          }
          q() {
            local out
            if ! out="$(psql "$DIRECT_URL" -v ON_ERROR_STOP=1 -Atc "$1" 2>"$OUTDIR/psql.err")"; then
              redact < "$OUTDIR/psql.err" >&2
              return 1
            fi
            printf '%s' "$out"
          }
          echo "### Final verification" >> "$GITHUB_STEP_SUMMARY"

          HIST="$(q "SELECT string_agg(migration_name, ',' ORDER BY started_at) FROM _prisma_migrations")"
          if [ "$HIST" != "$FINAL_HIST" ]; then
            echo "::error title=Migration history::unexpected applied set: $HIST"
            exit 1
          fi

          INCOMPLETE="$(q "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NULL OR rolled_back_at IS NOT NULL")"
          if [ "$INCOMPLETE" != "0" ]; then
            echo "::error title=Migration history::failed/incomplete migration rows present"
            exit 1
          fi

          verify_checksum() {
            local name="$1" expected="$2" actual
            actual="$(q "SELECT checksum FROM _prisma_migrations WHERE migration_name='$name'")"
            if [ "$actual" != "$expected" ]; then
              echo "::error title=History checksum mismatch::$name recorded checksum does not match the frozen SHA-256"
              return 1
            fi
            echo "- checksum OK: \`$name\`" >> "$GITHUB_STEP_SUMMARY"
          }
          verify_checksum "20240101000000_add_user_model" "$CHK_HIST_USER"
          verify_checksum "20240102000000_create_ceo_model" "$CHK_HIST_CEO"
          verify_checksum "20261017000000_phase6b1_economy_foundation" "$CHK_6B1"
          verify_checksum "20261017010000_phase6b2a_username_case_insensitive" "$CHK_6B2A"
          verify_checksum "$MIG_V25_ECON_NAME" "$CHK_V25_ECON"
          verify_checksum "$MIG_V25_PROG_NAME" "$CHK_V25_PROG"

          echo "- history OK: 6 rows (all finished, no failed rows, checksums match)" >> "$GITHUB_STEP_SUMMARY"

          npx prisma migrate status --schema "$SCHEMA" 2>&1 | redact
          echo "- ✅ prisma migrate status: no pending migrations" >> "$GITHUB_STEP_SUMMARY"

      - name: Regenerate Prisma client (codegen only)
        run: npx prisma generate --schema "$SCHEMA"

      - name: Job summary
        if: always()
        run: |
          {
            echo ""
            echo "---"
            echo "Guarded write workflow for the V2.5 migration set: two transactional applies + history recording."
            echo "Production is baselined at 4 rows; 6B.1/6B.2A are not touched. No re-baselining."
            echo "Credentials/SQL output are never streamed; captured output is redacted."
